spring.application.name=voucher-promo

server.port=${PORT:8085}

# MySQL-compatible runtime database. Use Cloud SQL in staging/production and a
# local MySQL container for development. H2 is intentionally not a runtime default.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/voucherpromo?allowPublicKeyRetrieval=true&sslMode=PREFERRED&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:${DB_USER:app}}
spring.datasource.password=${DB_PASSWORD:${DB_PASS:app}}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info

# Demo-only admin guard for POST /admin/vouchers
app.admin-token=${ADMIN_TOKEN:local-demo-admin-token}
app.internal-token=${INTERNAL_API_TOKEN:json-internal-token}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.demo-seed.enabled=${APP_DEMO_SEED_ENABLED:false}

# Business time zone for voucher start/end window checks (defaults to system time zone).
app.time-zone=${APP_TIME_ZONE:}
