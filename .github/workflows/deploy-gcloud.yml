name: Deploy to Cloud Run

on:
  push:
    branches:
      - staging
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_REGION: us-central1
  CLOUDRUN_SERVICE: voucher-promo-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'staging' && 'gcp-staging' || 'gcp-prod' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Deploy to Cloud Run
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          APP_CORS_ALLOWED_ORIGINS: ${{ secrets.APP_CORS_ALLOWED_ORIGINS }}
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          INTERNAL_API_TOKEN: ${{ secrets.INTERNAL_API_TOKEN }}
        run: |
          trap 'rm -f deploy.env' EXIT
          {
            printf 'SPRING_PROFILES_ACTIVE=cloudsql\n'
            printf 'ADMIN_TOKEN=%s\n' "$ADMIN_TOKEN"
            printf 'APP_CORS_ALLOWED_ORIGINS=%s\n' "$APP_CORS_ALLOWED_ORIGINS"
            printf 'DB_URL=%s\n' "$DB_URL"
            printf 'DB_USERNAME=%s\n' "$DB_USERNAME"
            printf 'DB_PASSWORD=%s\n' "$DB_PASSWORD"
            printf 'INTERNAL_API_TOKEN=%s\n' "$INTERNAL_API_TOKEN"
          } > deploy.env

          gcloud run deploy "$CLOUDRUN_SERVICE" \
            --source . \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --region "$GCP_REGION" \
            --allow-unauthenticated \
            --max-instances=3 \
            --env-vars-file deploy.env

      - name: Smoke test
        run: |
          url="$(gcloud run services describe "$CLOUDRUN_SERVICE" \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --region "$GCP_REGION" \
            --format='value(status.url)')"
          curl --fail --silent --show-error "$url/health"
