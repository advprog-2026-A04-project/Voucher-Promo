name: Deploy to Cloud Run

on:
  push:
    branches:
      - staging
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_REGION: us-central1
  CLOUDRUN_SERVICE: voucher-promo-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'staging' && 'gcp-staging' || 'gcp-prod' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Deploy to Cloud Run
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          APP_CORS_ALLOWED_ORIGINS: ${{ secrets.APP_CORS_ALLOWED_ORIGINS }}
          CLOUD_SQL_INSTANCE_CONNECTION_NAME: ${{ secrets.CLOUD_SQL_INSTANCE_CONNECTION_NAME }}
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          INTERNAL_API_TOKEN: ${{ secrets.INTERNAL_API_TOKEN }}
        run: |
          trap 'rm -f deploy.env' EXIT
          db_url="${DB_URL:-}"
          while [[ "${db_url:0:1}" == "?" ]]; do
            db_url="${db_url:1}"
          done

          {
            printf 'SPRING_PROFILES_ACTIVE=cloudsql\n'
            printf 'ADMIN_TOKEN=%s\n' "$ADMIN_TOKEN"
            printf 'APP_CORS_ALLOWED_ORIGINS=%s\n' "$APP_CORS_ALLOWED_ORIGINS"
            printf 'CLOUD_SQL_INSTANCE_CONNECTION_NAME=%s\n' "$CLOUD_SQL_INSTANCE_CONNECTION_NAME"
            printf 'DB_URL=%s\n' "$db_url"
            printf 'DB_USERNAME=%s\n' "$DB_USERNAME"
            printf 'DB_PASSWORD=%s\n' "$DB_PASSWORD"
            printf 'INSTANCE_CONNECTION_NAME=%s\n' "$CLOUD_SQL_INSTANCE_CONNECTION_NAME"
            printf 'INTERNAL_API_TOKEN=%s\n' "$INTERNAL_API_TOKEN"
          } > deploy.env

          cloud_sql_args=()
          if [ -n "${CLOUD_SQL_INSTANCE_CONNECTION_NAME:-}" ]; then
            if [[ "$CLOUD_SQL_INSTANCE_CONNECTION_NAME" =~ ^[a-zA-Z0-9-]+:[a-zA-Z0-9-]+:[a-z][a-z0-9-]*$ ]] &&
              [ "${#CLOUD_SQL_INSTANCE_CONNECTION_NAME}" -le 97 ]; then
              cloud_sql_args+=(--add-cloudsql-instances "$CLOUD_SQL_INSTANCE_CONNECTION_NAME")
            else
              echo "::warning::Skipping invalid CLOUD_SQL_INSTANCE_CONNECTION_NAME value."
            fi
          fi

          project_id="${GOOGLE_CLOUD_PROJECT:-${CLOUDSDK_CORE_PROJECT}}"
          gcloud run deploy "$CLOUDRUN_SERVICE" \
            --source . \
            --project "$project_id" \
            --region "$GCP_REGION" \
            --allow-unauthenticated \
            --max-instances=3 \
            --env-vars-file deploy.env \
            "${cloud_sql_args[@]}"

      - name: Smoke test
        run: |
          project_id="${GOOGLE_CLOUD_PROJECT:-${CLOUDSDK_CORE_PROJECT}}"
          url="$(gcloud run services describe "$CLOUDRUN_SERVICE" \
            --project "$project_id" \
            --region "$GCP_REGION" \
            --format='value(status.url)')"
          curl --fail --silent --show-error "$url/health"
