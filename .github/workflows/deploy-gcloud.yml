name: Deploy to Cloud Run

on:
  push:
    branches:
      - staging
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_REGION: us-central1
  CLOUDRUN_SERVICE: voucher-promo-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'staging' && 'gcp-staging' || 'gcp-prod' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Deploy to Cloud Run
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          APP_CORS_ALLOWED_ORIGINS: ${{ secrets.APP_CORS_ALLOWED_ORIGINS }}
          CLOUD_SQL_INSTANCE_CONNECTION_NAME: ${{ secrets.CLOUD_SQL_INSTANCE_CONNECTION_NAME }}
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          INTERNAL_API_TOKEN: ${{ secrets.INTERNAL_API_TOKEN }}
        run: |
          trap 'rm -f deploy.env' EXIT
          default_db_url="jdbc:h2:mem:voucherpromo;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE"
          db_url="${DB_URL:-$default_db_url}"

          if [[ "$db_url" == *"jdbc:"* && "$db_url" != jdbc:* ]]; then
            db_url="jdbc:${db_url#*jdbc:}"
          fi

          if [[ "$db_url" != jdbc:* ]]; then
            echo "::warning::DB_URL does not start with jdbc; using demo H2 datasource."
            db_url="$default_db_url"
          fi

          cloud_sql_valid=false
          if [ -n "${CLOUD_SQL_INSTANCE_CONNECTION_NAME:-}" ]; then
            if [[ "$CLOUD_SQL_INSTANCE_CONNECTION_NAME" =~ ^[a-zA-Z0-9-]+:[a-zA-Z0-9-]+:[a-z][a-z0-9-]*$ ]] &&
              [ "${#CLOUD_SQL_INSTANCE_CONNECTION_NAME}" -le 97 ]; then
              cloud_sql_valid=true
            else
              echo "::warning::Skipping invalid CLOUD_SQL_INSTANCE_CONNECTION_NAME value."
            fi
          fi

          spring_profile=cloudsql
          demo_seed_enabled=false
          if [[ "$db_url" == jdbc:h2:* || "$cloud_sql_valid" != "true" ]]; then
            if [[ "$db_url" != jdbc:h2:* && "$cloud_sql_valid" != "true" ]]; then
              echo "::warning::Cloud SQL is not configured; using demo H2 datasource."
              db_url="$default_db_url"
            fi
            spring_profile=cloudrun
            demo_seed_enabled=true
          fi

          {
            printf 'SPRING_PROFILES_ACTIVE=%s\n' "$spring_profile"
            printf 'ADMIN_TOKEN=%s\n' "$ADMIN_TOKEN"
            printf 'APP_CORS_ALLOWED_ORIGINS=%s\n' "$APP_CORS_ALLOWED_ORIGINS"
            printf 'CLOUD_SQL_INSTANCE_CONNECTION_NAME=%s\n' "$CLOUD_SQL_INSTANCE_CONNECTION_NAME"
            printf 'DB_URL=%s\n' "$db_url"
            printf 'DB_USERNAME=%s\n' "$DB_USERNAME"
            printf 'DB_PASSWORD=%s\n' "$DB_PASSWORD"
            printf 'INSTANCE_CONNECTION_NAME=%s\n' "$CLOUD_SQL_INSTANCE_CONNECTION_NAME"
            printf 'INTERNAL_API_TOKEN=%s\n' "$INTERNAL_API_TOKEN"
            printf 'APP_DEMO_SEED_ENABLED=%s\n' "$demo_seed_enabled"
          } > deploy.env

          cloud_sql_args=()
          if [ "$cloud_sql_valid" = "true" ]; then
            cloud_sql_args+=(--add-cloudsql-instances "$CLOUD_SQL_INSTANCE_CONNECTION_NAME")
          fi

          project_id="${GOOGLE_CLOUD_PROJECT:-${CLOUDSDK_CORE_PROJECT}}"
          gcloud run deploy "$CLOUDRUN_SERVICE" \
            --source . \
            --project "$project_id" \
            --region "$GCP_REGION" \
            --allow-unauthenticated \
            --max-instances=3 \
            --env-vars-file deploy.env \
            "${cloud_sql_args[@]}"

      - name: Smoke test
        run: |
          project_id="${GOOGLE_CLOUD_PROJECT:-${CLOUDSDK_CORE_PROJECT}}"
          url="$(gcloud run services describe "$CLOUDRUN_SERVICE" \
            --project "$project_id" \
            --region "$GCP_REGION" \
            --format='value(status.url)')"
          curl --fail --silent --show-error "$url/health"
